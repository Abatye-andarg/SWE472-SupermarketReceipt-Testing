plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'com.approvaltests:approvaltests:12.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'
}

group = 'dojo'
version = '1.0.0-SNAPSHOT'

jacoco {
    toolVersion = '0.8.12'
}


// Print a one-line summary at the end of a test run (e.g. "RESULT: 25 tests, 25 passed, 0 failed, 0 skipped")
class SummaryListener implements TestListener {
    void beforeSuite(TestDescriptor d) {}
    void beforeTest(TestDescriptor d) {}
    void afterTest(TestDescriptor d, TestResult r) {}
    void afterSuite(TestDescriptor d, TestResult r) {
        if (d.parent == null) {
            println "\n================ RESULT: ${r.testCount} tests, ${r.successfulTestCount} passed, " +
                    "${r.failedTestCount} failed, ${r.skippedTestCount} skipped ================"
        }
    }
}

// Default suite: all ISP, graph-coverage and supporting tests.
// Tests tagged "defect" document known anomalies and are expected to FAIL,
// so they are excluded here and run separately with ./gradlew defectTest
test {
    useJUnitPlatform {
        excludeTags 'defect'
    }
    maxHeapSize = '1G'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
    addTestListener(new SummaryListener())
    finalizedBy jacocoTestReport
}

tasks.register('defectTest', Test) {
    description = 'Runs the tests that document known defects (expected to fail).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'defect'
    }
    testLogging {
        events 'passed', 'failed'
        exceptionFormat = 'short'
    }
    addTestListener(new SummaryListener())
    reports.html.outputLocation = layout.buildDirectory.dir('reports/defect-tests')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
